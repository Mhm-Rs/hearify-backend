spring:
  application:
    name: hearify
  datasource:
    url: jdbc:mysql://mysql-1718f0b2-hearify.f.aivencloud.com:15539/defaultdb
    username: avnadmin
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update

server:
  port: 5000

logging:
  level:
    org.springframework.jdbc.core: DEBUG
    org.springframework.orm.jpa: DEBUG
